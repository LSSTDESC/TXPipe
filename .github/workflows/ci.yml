name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # run this every week at 12 noon on Monday
    - cron: '0 12 * * 1'

env:
  EXAMPLE_DATA_FILE_VERSION: v10
  # Hopefully these will fix occasional crashes
  # when the network adapter on github actions doesn't
  # fully implement something called RDMA-capable NIC.
  UCX_TLS: tcp,sm,self
  UCX_NET_DEVICES: all
  OMPI_MCA_pml: ob1
  OMPI_MCA_btl: tcp,self,vader
  # This should help with Illegal Instruction diagnosis
  PYTHONFAULTHANDLER: "1"
jobs:
  # Run a download step first so that it is in
  # the cache, because all the other jobs will be running
  # at the same time and so might miss it. 
  Download_Data:
    runs-on: ubuntu-latest
    steps:
    - name: Cache example data
      id: cache-example
      uses: actions/cache@v4
      env:
        cache-name: cache-example-data
      with:
        path: |
          example.tar.gz
          example-cmb-lensing.tar.gz
        # update this when we change package contents and want
        # to force an update
        key: example-data-${{ env.EXAMPLE_DATA_FILE_VERSION }}
        # If the data is already cached, there is no need to retrieve it.
        lookup-only: true

    - name: Download test data
      if: steps.cache-example.outputs.cache-hit != 'true'
      # when ready to merge update the NERSC main file and then change this next line back
      run: |
        wget -O example.tar.gz  "https://portal.nersc.gov/cfs/lsst/txpipe/data/example-${{ env.EXAMPLE_DATA_FILE_VERSION }}.tar.gz"
        wget -O example-cmb-lensing.tar.gz "https://portal.nersc.gov/cfs/lsst/txpipe/data/example-cmb-lensing.tar.gz"

        
  Unit_Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        # Only the downloaded packages are cached, not the environment itself.
        # This lives outside ./conda so that it is independent of the install.
        path: ~/conda-pkgs
        key: ${{ matrix.os }}-conda-pkgs-${{ hashFiles('bin/install.sh','bin/environment*.yml') }}
        restore-keys: |
          ${{ matrix.os }}-conda-pkgs-

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/pip-cache
        key: ${{ matrix.os }}-pip-${{ hashFiles('bin/install.sh','bin/environment*.yml') }}
        restore-keys: |
          ${{ matrix.os }}-pip-

    - name: Set pip cache location
      run: echo "PIP_CACHE_DIR=$HOME/pip-cache" >> "$GITHUB_ENV"

    - name: Install conda environment
      run: |
        export CONDA_PKGS_DIRS="$HOME/conda-pkgs"
        ./bin/install.sh

    - name: Test with pytest
      run: |
        source conda/bin/activate
        python -m pip install -v --no-binary=ducc0 --force-reinstall --no-deps  ducc0
        ceci --version
        pytest txpipe

  CMB_Lensing_Pipeline:
    runs-on: ubuntu-latest
    needs: Download_Data
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        # Only the downloaded packages are cached, not the environment itself.
        # This lives outside ./conda so that it is independent of the install.
        path: ~/conda-pkgs
        key: ubuntu-latest-conda-pkgs-${{ hashFiles('bin/install.sh','bin/environment*.yml') }}
        restore-keys: |
          ubuntu-latest-conda-pkgs-

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/pip-cache
        key: ubuntu-latest-pip-${{ hashFiles('bin/install.sh','bin/environment*.yml') }}
        restore-keys: |
          ubuntu-latest-pip-

    - name: Set pip cache location
      run: echo "PIP_CACHE_DIR=$HOME/pip-cache" >> "$GITHUB_ENV"

    - name: Install conda environment
      run: |
        export CONDA_PKGS_DIRS="$HOME/conda-pkgs"
        ./bin/install.sh

    - name: Restore example data
      uses: actions/cache@v4
      with:
        path: |
          example.tar.gz
          example-cmb-lensing.tar.gz
        key: example-data-${{ env.EXAMPLE_DATA_FILE_VERSION }}
        fail-on-cache-miss: true

    - name: Extract test data
      run: |
        tar -zxvf example-cmb-lensing.tar.gz

    - name: Run pipeline
      run: |
        mkdir -p cache/workspaces
        source ./conda/bin/activate
        # Manually re-install ducc0 to try and avoid illegal instruction crashes
        python -m pip install -v --no-binary=ducc0 --force-reinstall --no-deps  ducc0
        ceci examples/cmb/quaia.yml
        test -f data/cmb/outputs_quaia/twopoint_data_fourier_cmb_cross_density_plot.png

    - name: Show logs
      if: always()
      run: |
        # always run
        cat data/cmb/logs_quaia/*

        
  Pipelines:
    runs-on: ${{ matrix.os }}
    needs: Download_Data
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pipeline: metadetect
          - os: ubuntu-latest
            pipeline: scalar_metadetect
          - os: ubuntu-latest
            pipeline: metacal
          - os: ubuntu-latest
            pipeline: redmagic
          - os: ubuntu-latest
            pipeline: lensfit
          - os: ubuntu-latest
            pipeline: metadetect_source_only
          - os: ubuntu-latest
            pipeline: mock_shear
          - os: macos-14
            pipeline: metadetect

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        # Only the downloaded packages are cached, not the environment itself.
        # This lives outside ./conda so that it is independent of the install.
        path: ~/conda-pkgs
        key: ${{ matrix.os }}-conda-pkgs-${{ hashFiles('bin/install.sh','bin/environment*.yml') }}
        restore-keys: |
          ${{ matrix.os }}-conda-pkgs-

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/pip-cache
        key: ${{ matrix.os }}-pip-${{ hashFiles('bin/install.sh','bin/environment*.yml') }}
        restore-keys: |
          ${{ matrix.os }}-pip-

    - name: Set pip cache location
      run: echo "PIP_CACHE_DIR=$HOME/pip-cache" >> "$GITHUB_ENV"

    - name: Install conda environment
      run: |
        export CONDA_PKGS_DIRS="$HOME/conda-pkgs"
        ./bin/install.sh

    - name: Restore example data
      uses: actions/cache@v4
      with:
        path: |
          example.tar.gz
          example-cmb-lensing.tar.gz
        key: example-data-${{ env.EXAMPLE_DATA_FILE_VERSION }}
        fail-on-cache-miss: true

    - name: Extract test data
      run: |
        tar -zxvf example.tar.gz

    - name: Run pipeline
      run: |
        mkdir -p cache/workspaces
        source ./conda/bin/activate
        python -m pip install -v --no-binary=ducc0 --force-reinstall --no-deps  --no-deps  ducc0
        # Just for the metadetect source pipeline
        # we activate the debug mode with an env var
        if [ "${{ matrix.pipeline }}" == "metadetect_source_only" ]; then
          export TX_DASK_DEBUG=1
        fi
        if [ "${{ matrix.pipeline }}" == "scalar_metadetect" ]; then
          python bin/make_scalar_metadetect.py
        fi
        ceci examples/${{ matrix.pipeline }}/pipeline.yml

        if [ "${{ matrix.pipeline }}" == "mock_shear" ]; then
          test -f data/example/outputs_mock_shear/binned_shear_catalog.hdf5
        else
          test -f data/example/outputs_${{ matrix.pipeline }}/shear_xi_plus.png
        fi

    - name: Run metadetect with multi-length data
      if: ${{ matrix.pipeline == 'metadetect' && matrix.os == 'ubuntu-latest' }}
      run: |
        source ./conda/bin/activate
        python -m pip install -v --no-binary=ducc0 --force-reinstall --no-deps  ducc0

        # remove the old target file
        rm -f data/example/outputs_${{ matrix.pipeline }}/shear_xi_plus.png

        # Generate the new data file
        python bin/make_metadetect_file_different_lengths.py

        # Run the pipeline with the new file
        ceci examples/metadetect/pipeline.yml resume=restart inputs.shear_catalog=data/example/inputs/metadetect_shear_catalog_different_lengths.hdf5

        test -f data/example/outputs_${{ matrix.pipeline }}/shear_xi_plus.png


    - name: Dry run DP1
      run: |
        source ./conda/bin/activate
        ceci --dry-run examples/dp1/pipeline-edfs.yml


    - name: Show logs
      if: always()
      run: |
        # always run
        cat data/example/logs_${{ matrix.pipeline }}/*
