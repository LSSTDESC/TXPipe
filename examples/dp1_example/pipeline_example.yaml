# modules and packages to import that have pipeline
# stages defined in them
modules: >
    txpipe
    txpipe.extensions
    txpipe.extensions.hos.fsb
    rail.creation.degraders.grid_selection
    rail.creation.engines.flowEngine
    rail.estimation.algos.nz_dir
    rail.estimation.algos.bpz_lite

# where to find any modules that are not in this repo,
# and any other code we need.
python_paths:
  - submodules/WLMassMap/python/desc/
  - submodules/pyfsb

# Where to put outputs
output_dir: data/example/outputs_metadetect_dp1_sel

# How to run the pipeline: mini, parsl, or cwl
launcher:
    name: mini
    interval: 1.0

# Where to run the pipeline: cori-interactive, cori-batch, or local
site:
    name: local
    max_threads: 2

# configuration settings
config: examples/dp1_example/config_example.yaml

# On NERSC, set this before running:
# export DATA=${LSST}/groups/WL/users/zuntz/data/metacal-testbed

inputs:
    # See README for paths to download these files
    # metadetect_catalog: none
    shear_catalog: data/txpipe_dp1_all/download/ingested_shear_DP1_precut.hdf5
    photometry_catalog: none
    shear_tomography_classifier: data/txpipe_dp1_all/download/shear_tomography_classifier_onebin.pkl
    spectroscopic_catalog: none
    # exposures: data/txpipe_dp1_all/download/anacal2_gaia_stars/combined.hdf5
    # Built by bin/make_dp1_star_catalog.py from combined.hdf5
    star_catalog: data/txpipe_dp1_all/download/anacal2_gaia_stars/star_catalog.hdf5
    # This file comes with the code
    fiducial_cosmology: data/fiducial_cosmology.yml
    # For the self-calibration extension if we are not using random_catalog_source for now
    # So it is set to Null, so the yaml intepreter returns a None value to python. OBS 
    # the binned_random_catalog_source should also be set to Null in this case.
    binned_random_catalog_source: None
    flow: data/example/inputs/example_flow.pkl
    # Built by bin/make_dp1_source_nz.py from the SITCOMTN-154 gold photo-z table
    shear_photoz_stack: data/txpipe_dp1_all/download/shear_photoz_stack_fzboost.hdf5
    # Built by bin/make_dp1_tracer_metadata.py (replaces TXTracerMetadata; no lens mask)
    # tracer_metadata: data/example/outputs_metadetect_dp1_sel/tracer_metadata.hdf5
    lens_photoz_stack: none
    binned_random_catalog: none
    binned_random_catalog_sub: none
    lens_tomography_catalog: none
    random_cats: none
    # lens_photoz_stack: None
    # shear_photoz_stack: None
    # random_cats: None
    # binned_random_catalog: None
    # binned_star_catalog: None
    # patch_centers: None
    # tracer_metadata: None

# if supported by the launcher, restart the pipeline where it left off
# if interrupted
resume: true
# where to put output logs for individual stages
log_dir: data/example/logs_metadetect-dp1_sel
# where to put an overall parsl pipeline log
pipeline_log: data/example/log_dp1_sel.txt
