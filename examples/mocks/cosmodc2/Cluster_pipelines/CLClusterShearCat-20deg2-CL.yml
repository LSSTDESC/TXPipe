#this step depends on where you run
#for CCin2p3
site:
    name: cc-parallel
    mpi_command: mpirun -n

#for NERSC
#site:
#    name: cori-batch
#    image: ghcr.io/lsstdesc/txpipe-dev


#all the following steps should not depend on where you run 
launcher:
    name: mini
    interval: 3.0
modules: >
    txpipe
    txpipe.extensions
    rail.estimation.algos.bpz_lite

python_paths: []

stages:
#    - name: TXComputeShearCalibrationMetadetect
#      nprocess: 30
#    - name: Inform_BPZ_lite
#      nprocess: 1
#    - name: BPZ_lite
#      nprocess: 30
#    - name: CLClusterBinningRedshiftRichness
#      nprocess: 1
  - name: CLClusterSourceSelect
    nprocess: 1
#     - name: CLClusterEnsembleProfiles
#       nprocess: 1
#    - name: CLClusterDataVector
#      nprocess: 1


output_dir: data/mocks/cosmodc2/outputs-20deg2-CL
config: ./examples/mocks/cosmodc2/Cluster_pipelines/config-20deg2-CL.yml

inputs:
    # See README for paths to download these files
    shear_catalog: ./data/cosmodc2/20deg2/shear_catalog.hdf5
    cluster_catalog: ./data/cosmodc2/20deg2/cluster_catalog.hdf5
    # made by a full run of pipeline-20deg2-CL-*.yml
    shear_selection: data/mocks/cosmodc2/outputs-20deg2-CL/shear_selection.hdf5
    shear_tomography_catalog: data/mocks/cosmodc2/outputs-20deg2-CL/shear_tomography_catalog.hdf5
    source_photoz_pdfs: data/mocks/cosmodc2/outputs-20deg2-CL/source_photoz_pdfs.hdf5
    fiducial_cosmology: ./data/fiducial_cosmology.yml

resume: true
log_dir: data/mocks/cosmodc2/logs
pipeline_log: data/mocks/cosmodc2/log_20deg2.txt

