#this step depends on where you run
#for CCin2p3
site:
    name: cc-parallel
    mpi_command: mpirun -n

#for NERSC
#site:
#    name: cori-batch
#    image: ghcr.io/lsstdesc/txpipe-dev


#all the following steps should not depend on where you run 
launcher:
    name: mini
    interval: 3.0

modules: >
    txpipe
    txpipe.extensions
    rail.estimation.algos.bpz_lite

python_paths: []

stages:
#    - name: TXComputeShearCalibrationMetadetect
#      nprocess: 1
#    - name: Inform_BPZ_lite
#      nprocess: 1
#    - name: BPZ_lite
#      nprocess: 1
  - name: CLClusterBinningRedshiftRichness
    nprocess: 1
  - name: CLClusterSourceSelect
    nprocess: 1
  - name: CLClusterShearCalibrator
    nprocess: 1
  - name: CLClusterEnsembleProfiles
    nprocess: 1
#    - name: CLClusterDataVector
#      nprocess: 1



output_dir: data/mocks/cosmodc2/outputs-1deg2-CL
config: examples/mocks/cosmodc2/Cluster_pipelines/config-1deg2-CL.yml

inputs:
    # See README for paths to download these files
    shear_catalog: ./data/example/inputs/metadetect_shear_catalog.hdf5
    #photometry_catalog:  ./data/example/inputs/photometry_catalog.hdf5
    fiducial_cosmology: ./data/fiducial_cosmology.yml
    #calibration_table: ./data/example/inputs/sample_cosmodc2_w10year_errors.dat
    #spectroscopic_catalog: ./data/example/inputs/mock_spectroscopic_catalog.hdf5
    cluster_catalog: ./data/example/inputs/cluster_catalog.hdf5
    # made by the metadetect test pipeline, examples/test/metadetect/pipeline.yml
    shear_selection: data/test/metadetect/outputs_metadetect/shear_selection.hdf5
    shear_bin_assignments: data/test/metadetect/outputs_metadetect/shear_bin_assignments.hdf5
    shear_tomography_catalog: data/test/metadetect/outputs_metadetect/shear_tomography_catalog.hdf5
    # the bins of the sheared versions, only for variant_pairs of CLClusterSourceSelect
    shear_bin_assignments: none
    source_photoz_pdfs: ./data/example/inputs/photoz_pdfs.hdf5
resume: true
log_dir: data/mocks/cosmodc2/logs
pipeline_log: data/mocks/cosmodc2/log_1deg2.txt

