launcher:
    name: mini
    interval: 3.0

site:
    name: cori-interactive
    image: ghcr.io/lsstdesc/txpipe

modules: txpipe

stages:
    - name: TXBuzzardMock
      nprocess: 4

output_dir: data/mocks/buzzard/outputs
config: examples/mocks/buzzard/config.yml

# On NERSC, set this before running:
# export DATA=${LSST}/groups/WL/users/zuntz/data/metacal-testbed

inputs:
    # See README for paths to download these files
    response_model: /global/projecta/projectdirs/lsst/groups/WL/users/zuntz/data/DESY1-R-model.hdf5

resume: True
log_dir: data/mocks/buzzard/logs
pipeline_log: data/mocks/buzzard/log.txt

