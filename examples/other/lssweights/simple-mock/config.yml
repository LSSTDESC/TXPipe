# Values in this section are accessible to all the different stages.
# They can be overridden by individual stages though.
global:
    # This is read by many stages that read complete
    # catalog data, and tells them how many rows to read
    # at once
    chunk_rows: 100000
    # These mapping options are also read by a range of stages
    pixelization: healpix
    nside: 256 #if you load an external map this should match the nside of that mask
    sparse: True  # Generate sparse maps - faster if using small areas

TXLSSDensitySkyCuts:
    supreme_path_root: /global/cfs/cdirs/lsst/groups/WLSS/users/tcornish/simple-mock-data/sysmaps/
    nbin: 10                # number of bins per SP map to compute 1d trends
    simple_cov: true        # If false will use diagonal shot noise covariance
    diag_blocks_only: false  # If True and simple_cov=False, will compute only diagonal blocks of covariance
    b0: [1.]
