# TXPipe pipeline: real DP2 catalog ingestion -> density maps -> C_ell
#
# Ingests the real DP2 catalog built by dp2_preproc.py (not a mock -- see
# examples/dp2_mocks/ for the Cardinal/Flagship pipelines this is modeled on).
# Single wide magnitude-limited lens bin, no tomography (no redshift info in
# the catalog). Lens-only: TXTwoPointFourier only computes pos-pos spectra.

stages:
  - name: TXIngestDP2Catalog

  - name: TXTruthLensSelector
  - name: TXTruthLensCatalogSplitter
  - name: TXLSSWeightsUnit

  - name: TXPhotozLensStack
    classname: TXTruePhotozStack
    aliases:
        catalog: photometry_catalog
        tomography_catalog: lens_tomography_catalog_unweighted
        photoz_stack: lens_photoz_stack
        weights_catalog: none

  - name: TXLensMapsMasked
  # - name: TXSimpleMask   # unused, mask is supplied
  - name: TXDensityMaps

  - name: TXTracerMetadata

  - name: TXLSSDensityNullTests
  - name: TXSystematicsTwoPointFourier

  # - name: TXLensNoiseMaps

  - name: TXTwoPointFourier
    threads_per_process: 2

  - name: TXFourierNamasterCovariance

modules: >
    txpipe
    txpipe.extensions

output_dir: data/outputs/dp2_snri5

launcher:
  name: mini
  interval: 1.0

site:
  name: local
  max_threads: 4

config: examples/dp2/config.yaml

inputs:
  fiducial_cosmology: data/fiducial_cosmology.yml

  mask: /pscratch/sd/a/anicola/dp2/data/masks/rubin_dp2_wide_footprint_riz_wf0.2.0_bsm1.1.0_bgm2.0.0_starmasked_galmasked_ebv_maglim_nside1024_sfd_connected.hdf5
  # mask: /pscratch/sd/a/anicola/dp2/data/masks/survey_mask_nside1024_sfd.hdf5

  none: none

  shear_tomography_catalog: none
  shear_catalog: none
  shear_photoz_stack: data/inputs/shear_photoz_stack.hdf5

  source_maps: data/inputs/source_maps.hdf5
  source_noise_maps: data/inputs/source_noise_maps.hdf5
  lens_noise_maps: data/inputs/source_noise_maps.hdf5

resume: True
log_dir: data/logs
pipeline_log: data/pipeline_log.txt
