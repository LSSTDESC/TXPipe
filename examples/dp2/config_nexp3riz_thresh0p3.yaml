# Same as config.yaml, but with cache_dir/scratch_dir specific to the
# nexp3riz_thresh0p3 mask variant (see pipeline_nexp3riz_thresh0p3.yaml) -- NaMaster workspace
# caches are sized for a specific mask's sky fraction.

global:
  chunk_rows: 100000
  pixelization: healpix
  nside: 1024
  sparse: True


TXIngestDP2Catalog:
  fits_path: /global/cfs/cdirs/lsst/groups/WLSS/users/anicola/dp2/data/catalog_bsm1.1.0_bgm2.0.0_gaapugrizy_f99csfd/cat_survey_nexp3riz.fits
  bands: [r, i, z]
  nside: 1024
  dummy_redshift: 0.5
  chunk_rows: 100000


TXTruthLensSelector:
  lens_zbin_edges: [0.0, 1.0]
  redshift_column: redshift_true
  selection_type: maglim
  maglim_band: r
  maglim_limit: 23.5
  snr_i_cut: 5.0


TXPhotozLensStack:
  # name: required here for ceci's classname aliasing to resolve correctly.
  name: TXPhotozLensStack
  nz: 100
  zmax: 1.0
  redshift_group: photometry
  redshift_col: redshift_true


TXLSSDensityNullTests:
  # supreme_path_root is a glob prefix (globs f"{root}*.hsp" etc.), not a
  # directory -- the trailing "*_nside1024" selects only the nside=1024
  # survey-property maps and skips the native-resolution maglim map.
  supreme_path_root: /global/cfs/cdirs/lsst/groups/WLSS/users/anicola/dp2/data/spmaps/*_nside1024
  fill_missing_pix: True
  simple_cov: True


TXLensMapsMasked:
  chunk_rows: 100000
  mask_threshold: 0.0


TXDensityMaps:
  mask_threshold: 0.0


TXTracerMetadata:
  true_nz: False


TXTwoPointFourier:
  # the theory it would compute is never used (the deprojection-bias guess is the measured
  # pseudo-C_ell), and it goes through the buggy Firecrown path
  compute_theory: False
  # 6 linear bins of width 20 from ell = 2 to 122, then 14 logarithmic bins to 1500 (2026-11-04; was
  # 19 log bins from ell = 10, whose narrow low-ell bins were ill-conditioned)
  ell_min: 2
  ell_max: 1500
  ell_edges: [2, 22, 42, 62, 82, 102, 122, 145, 174, 208, 249, 298, 357, 427, 511, 612, 732, 876, 1048, 1253, 1500]
  mask_threshold: 0.0

  do_pos_pos: True
  do_shear_pos: False
  do_shear_shear: False

  true_shear: False
  # deproject the survey-property maps from the density field; main output is
  # deprojected, twopoint_data_fourier_no_deproj holds the same spectra without
  deproject_syst_clustering: True
  also_compute_no_deproj: True
  systmaps_clustering_dir: /global/cfs/cdirs/lsst/groups/WLSS/users/anicola/dp2/data/spmaps_nside1024
  systmaps_healsparse_reduction: mean

  cache_dir: data/cache_dp2_snri5_f99csfd_nexp3riz_thresh0p3
  analytic_noise: True


TXSystematicsTwoPointFourier:
  # the 48 nside=1024 survey-property maps (links; same set as TXLSSDensityNullTests)
  systmaps_clustering_dir: /global/cfs/cdirs/lsst/groups/WLSS/users/anicola/dp2/data/spmaps_nside1024
  systmaps_healsparse_reduction: mean
  # same mask threshold and ell binning as TXTwoPointFourier
  mask_threshold: 0.0
  # 6 linear bins of width 20 from ell = 2 to 122, then 14 logarithmic bins to 1500 (2026-11-04; was
  # 19 log bins from ell = 10, whose narrow low-ell bins were ill-conditioned)
  ell_min: 2
  ell_max: 1500
  ell_edges: [2, 22, 42, 62, 82, 102, 122, 145, 174, 208, 249, 298, 357, 427, 511, 612, 732, 876, 1048, 1253, 1500]
  # own cache per mask variant (NaMaster workspaces depend on the mask)
  cache_dir: data/cache_systematics_dp2_snri5_f99csfd_nexp3riz_thresh0p3

TXFourierNamasterCovariance:
  # same edges as TXTwoPointFourier (otherwise reconstructed from the effective ells)
  ell_edges: [2, 22, 42, 62, 82, 102, 122, 145, 174, 208, 249, 298, 357, 427, 511, 612, 732, 876, 1048, 1253, 1500]
  use_true_shear: False
  # same as TXTwoPointFourier.mask_threshold, so both use the same weight map
  mask_threshold: 0.0
  # no reliable n(z)/bias yet (all galaxies at the placeholder z=0.5), so build the
  # Gaussian covariance from the measured C_ell rather than a CCL prediction
  covariance_input_cls: measured
  scratch_dir: data/temp_dp2_snri5_f99csfd_nexp3riz_thresh0p3
