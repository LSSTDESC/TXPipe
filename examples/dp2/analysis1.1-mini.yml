# Stages to run
# Processors for PZ stages. There's a bug in rail_base logging
# that crashes if you use too many. PR in progress.

stages:
  - name: TXDP2DESCSelection
    nprocess: 8
  - name: PZCollateRailAssignmentsScalarMetadetect
  - name: TXComputeShearCalibrationScalarMetadetect    # select and split objects into source bins
    nprocess: 8
  - name: TXShearCalibration       # Calibrate and split the source sample tomographically
    nprocess: 8
  - name: TXSourceMaps             # make source g1 and g2 maps
    nprocess: 1
  - name: TXMapPlots             # make pictures of all the maps
  - name: TXTracerMetadata       # collate metadata
  - name: TXJackknifeCentersSource     # Split the area into jackknife regions
  - name: TXTwoPoint             # Compute real-space 2-point correlations
    threads_per_process: 8
    nprocess: 1
    nodes: 1
  - name: TXBlinding             # Blind the data following Muir et al
    threads_per_process: 4
  - name: TXTwoPointPlots        # Make plots of 2pt correlations
    aliases:
      twopoint_data_real: summary_statistics_real
  - name: TXPhotozPlotSource          # Plot the bin n(z)
    classname: TXPhotozPlot
    aliases:
        nz_plot: nz_source
        photoz_stack: shear_photoz_stack
  - name: TXRealGaussianCovariance
    threads_per_process: 8
  - name: TXDiagnosticQuantiles
  - name: TXPSFMaps
  - name: TXSourceDiagnosticPlots
    nprocess: 8
  - name: TXResponseInBins
    nprocess: 8
  - name: PZSOMInformer
    classname: SOMPZInformer
    module_name: rail.estimation.algos.sompz
    threads_per_process: 8
    aliases:
      model: deep_model
      input_data: sub_selected_shear_data
  - name: PZAssignSpectroGalaxiesToCells
    classname: SOMPZEstimatorDeep
    module_name: rail.estimation.algos.sompz
    aliases:
      assignment: assignment_som_deepspec_estimator
      data: input_spec_data
  - name: PZRedshiftsForCells
    classname: SOMPZPzc
    nprocess: 1
    module_name: rail.estimation.algos.sompz
    aliases:
      cell_deep_spec_data: assignment_som_deepspec_estimator
      spec_data: input_spec_data
      pz_c: pz_c_som_pzc_stage

  - name: PZGenerateSOMInformerSubsample
    nprocess: 8 
# Loop over the different variants we need to get tomographic
# bin assignments for
{% for variant in ["ns", "1p", "1m"] %}
  - name: PZAssignGalaxiesToCells_{{ variant }}
    classname: SOMPZEstimatorDeep
    nprocess: 2
    
    threads_per_process: 2
    module_name: rail.estimation.algos.sompz
    aliases:
      data: shear_catalog
      assignment: assignment_som_deepdeep_estimator_{{ variant }}

  - name: PZTomographyAndNZ_{{ variant }}
    classname: SOMPZ_tomobin_and_nz_onesom
    nprocess: 1
    module_name: rail.estimation.algos.sompz
    aliases:
      spec_data: input_spec_data
      cell_deep_spec_data: assignment_som_deepspec_estimator
      balrog_data: shear_catalog
      cell_deep_balrog_data: assignment_som_deepdeep_estimator_{{ variant }}
      pz_c: pz_c_som_pzc_stage
      tomo_bins_wide: tomo_bins_wide_{{ variant }}
      bhat_for_wide_data: bhat_for_wide_data_{{ variant }}
      nz: shear_photoz_stack_{{ variant }}
{% endfor %}

  - name: PZAddNonTomographicNZ
    aliases:
      input_photoz_stack: shear_photoz_stack_ns
      output_photoz_stack: shear_photoz_stack

  # - name: TXFlagMaps
  # - name: TXSimpleMaskSource       # combine maps to make a simple mask
  # - name: TXSourceNoiseMaps      # Compute shear noise using rotations
  # - name: TXRoweStatistics       # Compute and plot Rowe statistics
  #   threads_per_process: 2
  # - name: TXGalaxyStarShear      # Compute and plot the star-galaxy shear cross-correlation
  # - name: PZRealizationsPlotSource     # Plot n(z) realizations
  #   classname: PZRealizationsPlot
  #   aliases:
  #       photoz_realizations: source_photoz_realizations
  #       photoz_realizations_plot: source_photoz_realizations_plot
  # - name: TXConvergenceMaps      # Make convergence kappa maps from g1, g2 maps
  # - name: TXConvergenceMapPlots   # Plot the convergence map
    # Disabled since not yet synchronised with new Treecorr MPI
    # - name: TXSelfCalibrationIA   # Self-calibration intrinsic alignments of galaxies

    # Disabling these as they takes too long for a quick test.
    # The latter two need NaMaster
    # - name: TXRealGaussianCovariance   # Compute covariance of real-space correlations
    # - name: TXFourierGaussianCovariance # Compute the C_ell covariance
    # - name: TXFourierTJPCovariance # Compute the C_ell covariance
    #   threads_per_process: 2


# modules and packages to import that have pipeline
# stages defined in them
modules: >
    txpipe

# where to find any modules that are not in this repo,
# and any other code we need.
python_paths: []

# Where to put outputs
output_dir: data/metadetect_desc_dp2

# How to run the pipeline: mini, parsl, or cwl
launcher:
    name: mini
    interval: 1.0

# Where to run the pipeline: cori-interactive, cori-batch, or local
site:
    name: local


# configuration settings
config: examples/dp2/config-mini.yml

# On NERSC, set this before running:
# export DATA=${LSST}/groups/WL/users/zuntz/data/metacal-testbed

inputs:
    # See README for paths to download these files
    # full_shear_catalog: data/metadetect_dp2_ingest/shear_catalog.hdf5
    # star_catalog: data/example/inputs/star_catalog.hdf5
    # This file comes with the code
    fiducial_cosmology: data/fiducial_cosmology.yml
    # This is a shear-only analysis (no clustering or GGL) so we use
    # these placeholders for all the lens-related files
    lens_maps: none
    depth_map: none
    bright_object_map: none
    density_maps: none
    lens_tomography_catalog: none
    binned_lens_catalog: none
    binned_random_catalog: none
    binned_random_catalog_sub: none
    lens_photoz_stack: none
    mask: /global/cfs/cdirs/lsst/utilities/data-registry/lsst_desc_working/user/zuntz/.gen_paths/txpipe_dp2_shear_catalog_desc_metaDetect_mask_1deg2_0.3.0/mini_mask.hdf5
    shear_catalog: /global/cfs/cdirs/lsst/utilities/data-registry/lsst_desc_working/user/zuntz/.gen_paths/txpipe_dp2_shear_catalog_desc_metaDetect_1deg2_0.3.0/mini_desc_dp2_shear_catalog.hdf5
    input_spec_data: data/pz_dp2_ingest/mdet_redshift_for_sompz.hdf5

# if supported by the launcher, restart the pipeline where it left off
# if interrupted
resume: true
# where to put output logs for individual stages
log_dir: data/metadetect_dp2/logs
# where to put an overall parsl pipeline log
pipeline_log: data/metadetect_dp2/log.txt
#registry: {}