# Config for the DP2 cluster Delta Sigma pipeline (pipeline-dp2-CL-deltasigma-rubin-nersc.yml).
# The sections for the shared stages are copied from config-dp2-CL-gglens.yml without changes,
# so the outputs already in output_dir stay valid; keep them in sync with that file.
# The sections under "randoms" and "Delta Sigma around clusters" are new.

CLIngestClusterCSV: {}   # CSV -> clusters HDF5 group; the column-name defaults match external_0723_x_dp2.csv

global:
    nside: 64
    chunk_rows: 1000000

TXIngestHealsparseMask: {}   # no options: reads the registry .hsp and rewrites it as a TXPipe mask file

TXSourceTomography:
    bands: [g, r, i, z] # must match the shear catalog bands, which TXSourceSelectorMetadetectDP2 uses
    source_zbin_edges: [0.1, 0.9, 3.0] # two source bins; must match TXSourceSelectorMetadetectDP2

TXSourceSelectorMetadetectDP2:
    input_pz: false
    bands: [g, r, i, z] # the selector takes the bands from the catalog file
    T_cut: 0.5
    s2n_cut: 10.0
    delta_gamma: 0.02
    source_zbin_edges: [0.1, 0.9, 3.0]   # must match TXSourceTomography
    true_z: false
    do_tomography: true
    # DP2 cuts, copied from examples/dp2/config.yml (mag/colour cuts are placeholders)
    mag_g_cut: 30.0
    mag_r_cut: 30.0
    mag_i_cut: 30.0
    mag_z_cut: 30.0
    gr_cut: 5.0
    ri_cut: 5.0
    iz_cut: 5.0
    mfrac_cut: 0.1
    T_max: 20.0                     # gauss_T < T_max (older TXPipe versions called this gauss_T_cut)

BPZliteInformer:
    zmin: 0.0
    zmax: 3.0
    nzbins: 61
    bpz_ref_data_path: /global/cfs/cdirs/m1727/kabelo/TXPipe/data/example/rail-bpz-inputs
    spectra_file: CWWSB4.list
    ref_band: i
    bands: [r, i, z]
    hdf5_groupname: photometry
    # output_hdfn defaults to True, which reproduces the old "prior_file: hdfn_gen" behavior

BPZliteEstimator:
    zmin: 0.0
    zmax: 3.0
    # Coarse grid to keep the per-object PDF file small (~85 GB for the full
    # catalogue instead of ~390 GB at dz=0.01).
    dz: 0.05
    nzbins: 61
    bpz_ref_data_path: /global/cfs/cdirs/m1727/kabelo/TXPipe/data/example/rail-bpz-inputs
    bands: [mag_r, mag_i, mag_z]
    err_bands: [mag_err_r, mag_err_i, mag_err_z]
    filter_list: [DC2LSST_r, DC2LSST_i, DC2LSST_z]
    hdf5_groupname: shear/ns
    nondetect_val: .inf
    spectra_file: CWWSB4.list
    ref_band: mag_i
    p_min: 0.005
    gauss_kernel: 0.0
    zp_errors: [0.01, 0.01, 0.01]
    mag_err_min: 0.005
    madau_flag: "no"
    mag_limits:
        mag_r: 29.06
        mag_i: 28.62
        mag_z: 27.98

CLClusterBinningRedshiftRichness:
    zedge: [0.2, 0.4, 0.6, 0.8]
    richedge: [5., 10., 100.]

CLClusterLensCatalog: {}            # empty cluster bins are left out (richness 5-10 is empty for the DP2 overlap catalog)

TXPhotozStack:
    weight_col: shear/ns/weight

# ---------------- randoms ----------------

CLClusterRandoms:
    randoms_per_cluster: 10         # x all clusters in the catalog, every random inside the footprint
    richness_cutoff: 0.0            # no extra cut: the binning stage applies the same richness edges to clusters and randoms
    seed: 43

CLClusterBinningRedshiftRichnessRandoms:
    name: CLClusterBinningRedshiftRichnessRandoms   # instance name for the classname copy
    zedge: [0.2, 0.4, 0.6, 0.8]     # must match CLClusterBinningRedshiftRichness
    richedge: [5., 10., 100.]

# ---------------- Delta Sigma around clusters ----------------

# The sacc tracers are lens_k; the lens_k -> (zbin, richbin) mapping is in the zbin/richbin
# attrs of lens/bin_k in binned_lens_catalog.hdf5.
# NOTE: TXDeltaSigma has no flip_g2, so with the image-frame DP2 g2 the signal averages to ~zero for now.
TXDeltaSigma:
    source_bins: [0, 1]                # back to [0, 1] once the two-bin source files are regenerated
    lens_bins: [0, 1, 2]            # explicit: CLClusterLensCatalog writes no lens/bin_all
    photoz: true                    # use the source n(z) from TXPhotozStack, not per-object z
    r_min: 0.2                      # Mpc/h
    r_max: 10.0
    nbins: 11                       # logspace edges -> 10 radial bins
    source_cat_w_col: weight
    lens_cat_w_col: weight          # unit weights from CLClusterLensCatalog
    n_jobs: 32
    n_jackknife: 20                 # must not exceed the linked lenses per field; 30+ fails for lens bin 0 (81 clusters, 29 linked)

TXDeltaSigmaPlots:
    show_theory: false              # TXDeltaSigmaTheory is a galaxy HOD model, not run here

TXPhotozPlotSource:
    name: TXPhotozPlotSource

TXPhotozPlotLens:
    name: TXPhotozPlotLens
