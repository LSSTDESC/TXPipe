# DP2 cluster Delta Sigma pipeline for the RUBIN METADETECT shear catalog: dsigma excess surface
# density (TXDeltaSigma) with the clusters as lenses, with random subtraction and boost correction.
#   cluster catalog: CSV -> TXPipe cluster file -> redshift/richness bins
#                    -> binned lens catalog + lens n(z) (CLClusterLensCatalog)
#   shear catalog:   registry mask -> cut catalog -> source selection + calibration
#                    -> BPZ photo-z per source -> source n(z)
#   randoms:         source occupancy map at nside 1024 -> mask -> uniform depth -> TXRandomCat,
#                    with redshifts drawn from each cluster bin's n(z)
#   measurement:     TXDeltaSigma per (source bin 0, cluster bin k). The sacc tracers are named lens_k;
#                    the lens_k -> (zbin, richbin) mapping is in the zbin/richbin attrs of lens/bin_k in
#                    binned_lens_catalog.hdf5.
# NOTE: DP2 g2 is in the image-pixel frame (see config-dp2-CL.yml). TXTwoPoint flips it with flip_g2,
# but TXDeltaSigma reads g1/g2 as stored, so for now Delta Sigma is expected to average to ~zero.
# From the TXPipe directory, submit with
#     sbatch examples/dp2/Cluster_pipelines/dp2-deltasigma-rubin-nersc.sub
# Settings live in config-dp2-CL-deltasigma.yml. The shared stages use the same settings as
# pipeline-dp2-CL-gglens-rubin-nersc.yml and the same output_dir, so resume: true reuses their outputs.

#this step depends on where you run
#for NERSC
site:
    name: nersc-interactive

#all the following steps should not depend on where you run
launcher:
    name: mini
    interval: 3.0

modules: >
    txpipe
    txpipe.extensions.cluster_counts.bin_cluster
    txpipe.extensions.cluster_counts.cluster_lens_catalog
    rail.estimation.algos.bpz_lite
    txpipe.extensions.cluster_counts.ingest_csv

python_paths: []

stages:
  # ---- cluster catalog
  - name: CLIngestClusterCSV       # cluster CSV -> TXPipe cluster_catalog
  - name: CLClusterBinningRedshiftRichness
    nprocess: 1
  - name: CLClusterLensCatalog     # cluster bins -> binned_lens_catalog + lens_photoz_stack
    nprocess: 1

  # ---- shear catalog
  - name: TXIngestHealsparseMask   # registry .hsp mask -> TXPipe mask file (format conversion only)
  - name: TXCutShearCatalog        # keep the objects inside the mask
    nprocess: 64
    aliases:
      shear_catalog: full_shear_catalog
      cut_shear_catalog: shear_catalog
  - name: TXSourceTomography
    threads_per_process: 8
  - name: TXSourceSelectorMetadetectDP2    # DP2 cuts; 2x2 response from 1p/1m/2p/2m
    nprocess: 64
  - name: TXShearCalibration
    nprocess: 64

  # ---- source photo-z
  - name: BPZliteInformer          # output_hdfn defaults to true, so this just uses the HDFN prior
    nprocess: 1
    aliases:
      input: spectroscopic_catalog
      model: source_photoz_model
  - name: BPZliteEstimator         # per-object p(z) for the cut shear catalogue
    nprocess: 64
    aliases:
      model: source_photoz_model
      input: shear_catalog
      output: source_photoz_pdfs
  - name: TXPhotozStack            # source n(z) from the BPZ PDFs
    nprocess: 1
    aliases:
      photoz_pdfs: source_photoz_pdfs
      tomography_catalog: shear_tomography_catalog
      weights_catalog: shear_catalog
      photoz_stack: shear_photoz_stack

  # ---- randoms
  # The registry mask is nside 131072, too fine for TXRandomCat, so the randoms footprint is the
  # pixels hit by sources at nside 1024. Separate tags keep the nside-64 source_maps/mask files intact.
  - name: TXSourceMapsRandoms      # source maps at nside 1024
    classname: TXSourceMaps
    aliases:
      source_maps: randoms_source_maps
  - name: TXSimpleMaskSource       # pixels with lensing weight > 0
    aliases:
      source_maps: randoms_source_maps
      mask: randoms_mask
  - name: TXUniformDepthMap        # constant depth -> uniform random density
    aliases:
      mask: randoms_mask
      depth_map: randoms_depth_map
  - name: TXRandomCat              # randoms per cluster bin, z drawn from lens_photoz_stack
    aliases:
      mask: randoms_mask
      depth_map: randoms_depth_map

  # ---- Delta Sigma around clusters
  - name: TXDeltaSigma
    nprocess: 3                    # one rank per (source_0, lens_k) pair
    threads_per_process: 32
  - name: TXDeltaSigmaPlots
  - name: TXPhotozPlotSource       # Plot the source n(z)
    classname: TXPhotozPlot
    aliases:
        photoz_stack: shear_photoz_stack
        nz_plot: nz_source
  - name: TXPhotozPlotLens         # Plot the cluster bin n(z)
    classname: TXPhotozPlot
    aliases:
        photoz_stack: lens_photoz_stack
        nz_plot: nz_lens

# User-specific paths: change output_dir, log_dir, pipeline_log and the non-registry inputs to your own.
# Same output_dir as pipeline-dp2-CL-gglens-rubin-nersc.yml, so its finished stages are reused.
output_dir: /pscratch/sd/y/yyzhang/dp2/outputs/rubin
config: ./examples/dp2/Cluster_pipelines/config-dp2-CL-deltasigma.yml

inputs:
    # clusters: external catalogs (DES Y3 redMaPPer, ...) cross-matched to DP2 objects
    cluster_catalog_csv: /pscratch/sd/y/yyzhang/desc/TXPipe/dp2_cluster_overlap_jul23.csv
    # shear catalog, from the DESC data registry:
    # txpipe_dp2_shear_catalog_Rubin_metaDetect 0.3.0 (J. Zuntz), uncut
    full_shear_catalog:
        id: 137
    # rubin_dp2_wide_metadetect_mask 0.2.0 (S. Mau): riz coverage, bright-star (metadetect v2)
    # and bright-galaxy masks, b < -25
    shear_mask:
        id: 151
    spectroscopic_catalog: /global/cfs/cdirs/m1727/kabelo/TXPipe/data/example/outputs_metadetect/spectroscopic_catalog.hdf5
    fiducial_cosmology: data/fiducial_cosmology.yml
    # TXDeltaSigmaPlots only reads this when show_theory is true
    delta_sigma_theory: none

# needed for the `id:` lookups above; {} uses your default dataregistry config
registry: {}

resume: true
log_dir: /pscratch/sd/y/yyzhang/dp2/outputs/rubin/logs
pipeline_log: /pscratch/sd/y/yyzhang/dp2/outputs/rubin/log_CL_deltasigma_pipeline.txt
