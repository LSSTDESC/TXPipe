# Config for the full DP2 cluster-lensing pipelines (pipeline-dp2-CL-<catalog>-nersc.yml).
# One config for every shear catalog: the settings that must match between catalogs
# for a fair comparison (BPZ, cluster binning, profiles) are written once, and each
# catalog's source selector has its own section.
#
# The cluster-shear and profile stages run twice in each pipeline, once for
# Delta Sigma and once for the reduced tangential shear g_t, under the stage names
# below (ceci reads each stage's options from the section with its stage name).

CLIngestClusterCSV: {}   # CSV -> clusters HDF5 group; the column-name defaults match external_0723_x_dp2.csv

global:
    nside: 64
    chunk_rows: 1000000

TXIngestHealsparseMask: {}   # no options: reads the registry .hsp and rewrites it as a TXPipe mask file

TXSourceTomography:
    bands: [r, i, z] #used for selection
    source_zbin_edges: [0.1, 3.0] # this can be big, not doing cosmic shear

TXSourceSelectorMetadetectDP2:
    input_pz: false
    bands: [g, r, i, z] # the selector takes the bands from the catalog file
    T_cut: 0.5
    s2n_cut: 10.0
    delta_gamma: 0.02
    source_zbin_edges: [0.1, 3.0]
    true_z: false
    do_tomography: false
    # DP2 cuts, copied from examples/dp2/config.yml (mag/colour cuts are placeholders)
    mag_g_cut: 30.0
    mag_r_cut: 30.0
    mag_i_cut: 30.0
    mag_z_cut: 30.0
    gr_cut: 5.0
    ri_cut: 5.0
    iz_cut: 5.0
    mfrac_cut: 0.1
    T_max: 20.0                     # gauss_T < T_max (older TXPipe versions called this gauss_T_cut)

# Sheldon (DESC) metadetect catalog: E. Sheldon's Table 7 selection
# (lsst-mdet-dp2 v1.1, Sec. 3), as implemented in txpipe/source_selection/dp2_desc.py.
# Copied from examples/dp2/config.yml (J. Zuntz) except s2n_max.
TXSourceSelectorScalarMetadetectDP2:
    input_pz: false
    true_z: false
    delta_gamma: 0.02               # 1p - 1m = 2 x 0.01
    bands: [r, i, z]
    do_tomography: false
    max_psf_g: 0.05                 
    rmi_min: -2.0
    rmi_max: 3.0
    imz_min: -2.0
    imz_max: 3.0
    T_max: 20.0
    Tratio_min: 0.5
    Tratio_max: 20.
    s2n_min: 10.0
    s2n_max: 1000.0                 # Erin's Table 7 (the TXPipe default and example config use 100)
    mfrac_max: 0.1
    source_zbin_edges: [0.1, 3.0]   # single source bin, as for Rubin
    # required by the parent class but not used by these cuts:
    T_cut: -1.0
    s2n_cut: -1.0

BPZliteInformer:
    zmin: 0.0
    zmax: 3.0
    nzbins: 61
    bpz_ref_data_path: /global/cfs/cdirs/m1727/kabelo/TXPipe/data/example/rail-bpz-inputs
    spectra_file: CWWSB4.list
    ref_band: i
    bands: [r, i, z]
    hdf5_groupname: photometry
    # output_hdfn defaults to True, which reproduces the old "prior_file: hdfn_gen" behavior

BPZliteEstimator:
    zmin: 0.0
    zmax: 3.0
    # Coarse grid to keep the per-object PDF file small (~85 GB for the full
    # catalogue instead of ~390 GB at dz=0.01). The cluster stage only uses
    # ancil/zmode, and a 0.05 step is fine against delta_z: 0.2.
    dz: 0.05
    nzbins: 61
    bpz_ref_data_path: /global/cfs/cdirs/m1727/kabelo/TXPipe/data/example/rail-bpz-inputs
    bands: [mag_r, mag_i, mag_z]
    err_bands: [mag_err_r, mag_err_i, mag_err_z]
    filter_list: [DC2LSST_r, DC2LSST_i, DC2LSST_z]
    hdf5_groupname: shear/ns
    nondetect_val: .inf
    spectra_file: CWWSB4.list
    ref_band: mag_i
    p_min: 0.005
    gauss_kernel: 0.0
    zp_errors: [0.01, 0.01, 0.01]
    mag_err_min: 0.005
    madau_flag: "no"
    mag_limits:
        mag_r: 29.06
        mag_i: 28.62
        mag_z: 27.98

CLClusterBinningRedshiftRichness:
    zedge: [0.2, 0.4, 0.6, 0.8]
    richedge: [5., 10., 100.]

# ---------------- Delta Sigma profiles (Mpc) ----------------

CLClusterShearCatalogsDeltaSigma:
    name: CLClusterShearCatalogsDeltaSigma            # ceci identifies this copy of the stage by this name
    use_radius: true
    max_radius: 5.0                 # Mpc
    delta_z: 0.2
    redshift_cut_criterion: zmode
    redshift_weight_criterion: zmode
    redshift_cut_criterion_pdf_fraction: 0.9
    subtract_mean_shear: false
    # DP2 metadetect g1/g2 (Rubin and Sheldon catalogs) are in the image-pixel
    # frame, whose g2 has the opposite sign to the sky (East-of-North) frame.
    # "celestial" made CLMM rotate with the wrong g2 sign, so g_t averaged to zero
    coordinate_system: euclidean
    use_true_shear: false
    delta_sigma: true

CLClusterEnsembleProfilesDeltaSigma:
    name: CLClusterEnsembleProfilesDeltaSigma            # ceci identifies this copy of the stage by this name
    r_min: 0.2
    r_max: 4.5                      # Mpc; margin below max_radius=5.0 to avoid edge-of-selection bins
    nbins: 6
    bin_units: mpc
    cov_type: jackknife_covariance
    jackknife_nside: 64             # keep equal to global nside (different option name, so not inherited)
    magnification_profile: false

# ---------------- reduced tangential shear profiles (arcmin) ----------------

CLClusterShearCatalogsGt:
    name: CLClusterShearCatalogsGt            # ceci identifies this copy of the stage by this name
    use_radius: false
    max_angle: 22.0                 # arcmin; margin above r_max=20
    delta_z: 0.2
    redshift_cut_criterion: zmode
    redshift_weight_criterion: zmode
    redshift_cut_criterion_pdf_fraction: 0.9
    subtract_mean_shear: false
    # DP2 metadetect g1/g2 (Rubin and Sheldon catalogs) are in the image-pixel
    # frame, whose g2 has the opposite sign to the sky (East-of-North) frame.
    # "celestial" made CLMM rotate with the wrong g2 sign, so g_t averaged to zero
    coordinate_system: euclidean
    use_true_shear: false
    delta_sigma: false              # tangential/cross reduced shear; sigma_crit not applied

CLClusterEnsembleProfilesGt:
    name: CLClusterEnsembleProfilesGt            # ceci identifies this copy of the stage by this name
    # For the binned clusters (z = 0.2-0.8) the delta_sigma range of
    # 0.2-4.5 Mpc is ~0.4-1.0 to ~10-23 arcmin under the fiducial cosmology.
    r_min: 1.0                      # arcmin
    r_max: 20.0                     # arcmin; margin below max_angle=22 to avoid edge-of-selection bins
    nbins: 6
    bin_units: arcmin
    cov_type: jackknife_covariance
    jackknife_nside: 64             # keep equal to global nside (different option name, so not inherited)
    magnification_profile: false
