output_dir: data/pz_dp2
log_dir: .
resume: false
config: examples/dp2/pz_config.yml
modules: rail
inputs:
  # deep_model: model_deep.pkl
  input_deep_data: /sdf/home/z/zhzhuoqi/rubin-user/DP2/DP2_test_WZ/mdet_catalog.hdf5
  input_deep_data_inform: data/pz_dp2/mdet_for_sompz.hdf5
  input_spec_data: /sdf/home/z/zhzhuoqi/rubin-user/DP2/DP2_test_WZ/mdet_redshift_for_sompz.hdf5
stages:
- name: som_deep_informer_big
  classname: SOMPZInformer
  module_name: rail.estimation.algos.sompz
  threads_per_process: 16
  aliases:
    model: deep_model
    input_data: input_deep_data_inform
- name: som_deepdeep_estimator
  classname: SOMPZEstimatorDeep
  nprocess: 32
  module_name: rail.estimation.algos.sompz
  aliases:
    data: input_deep_data
    assignment: assignment_som_deepdeep_estimator
- name: som_deepspec_estimator
  classname: SOMPZEstimatorDeep
  nprocess: 32
  module_name: rail.estimation.algos.sompz
  aliases:
    assignment: assignment_som_deepspec_estimator
    data: input_spec_data
- name: som_pzc_stage
  classname: SOMPZPzc
  nprocess: 1
  module_name: rail.estimation.algos.sompz
  aliases:
    cell_deep_spec_data: assignment_som_deepspec_estimator
    spec_data: input_spec_data
    pz_c: pz_c_som_pzc_stage
# - name: sompz_tomobin_and_nz_onesom_binning4
#   classname: SOMPZ_tomobin_and_nz_onesom
#   nprocess: 1
#   module_name: rail.estimation.algos.sompz
#   aliases:
#     spec_data: input_spec_data
#     cell_deep_spec_data: assignment_som_deepspec_estimator
#     balrog_data: input_deep_data
#     cell_deep_balrog_data: assignment_som_deepdeep_estimator
#     pz_c: pz_c_som_pzc_stage
#     tomo_bins_wide: tomo_bins_wide_binning4
#     bhat_for_wide_data: bhat_for_wide_data_binning4
#     nz: nz_binning4
- name: sompz_tomobin_and_nz_onesom_binning5
  classname: SOMPZ_tomobin_and_nz_onesom
  nprocess: 1
  module_name: rail.estimation.algos.sompz
  aliases:
    spec_data: input_spec_data
    cell_deep_spec_data: assignment_som_deepspec_estimator
    balrog_data: input_deep_data
    cell_deep_balrog_data: assignment_som_deepdeep_estimator
    pz_c: pz_c_som_pzc_stage
    tomo_bins_wide: tomo_bins_wide_binning5
    bhat_for_wide_data: bhat_for_wide_data_binning5
    nz: nz_binning5
site:
  max_threads: 32
  name: local
