TXTwoPoint:
    bin_slop: 0.01
    delta_gamma: 0.02
    do_pos_pos: false
    do_shear_shear: true
    do_shear_pos: false
    flip_g2: true
    min_sep: 2.5
    max_sep: 240.0
    nbins: 20
