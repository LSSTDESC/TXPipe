{% for variant in ["ns", "1p", "1m"] %}
PZAssignGalaxiesToCells_{{ variant }}:
    output_mode: default
    hdf5_groupname: 'shear/{{ variant }}'
    calculated_point_estimates:  []
    recompute_point_estimates: false
    inputs:
    - flux_r
    - flux_i
    - flux_z
    input_errs:
    - flux_err_r
    - flux_err_i
    - flux_err_z
    zero_points:
    - 31.4
    - 31.4
    - 31.4
    som_minerror: 0.001
    set_threshold: true
    thresh_val: 1.0e-05
    name: PZAssignGalaxiesToCells_{{ variant }}
    thresh_val_err: 1.0e-05
    config: null

PZTomographyAndNZ_{{ variant }}:
    output_mode: default
    hdf5_groupname: 'shear/{{ variant }}'
    calculated_point_estimates: []
    recompute_point_estimates: false
    make_equal_occ_bins: false
    bin_edges:
    - 0.1
    - 0.4
    - 0.6
    - 0.8
    - 9999.9
    name: PZTomographyAndNZ_{{ variant }}
    balrog_groupname: "shear/{{ variant }}"
{% endfor %}
  
