# Stages to run

{% set pipe_name = "rubin_metadetect" %}


stages:
  - name: TXCutShearCatalog
    nprocess: 64
    aliases:
      shear_catalog: full_shear_catalog
      cut_shear_catalog: shear_catalog
  - name: TXDP2RubinMetadetectSelection
    nprocess: 64
  - name: PZCollateRailAssignmentsMetadetect
  - name: TXComputeShearCalibrationMetadetect    # select and split objects into source bins
    nprocess: 64
  - name: TXShearCalibration       # Calibrate and split the source sample tomographically
    nprocess: 64
  - name: TXSourceMaps             # make source g1 and g2 maps
    nprocess: 1
  - name: TXMapPlots             # make pictures of all the maps
  - name: TXTracerMetadata       # collate metadata
  - name: TXJackknifeCentersSource     # Split the area into jackknife regions
  - name: TXTwoPoint             # Compute real-space 2-point correlations
    threads_per_process: 128
    nprocess: 1
    nodes: 1
  - name: TXBlinding             # Blind the data following Muir et al
    threads_per_process: 4
  - name: TXTwoPointPlots        # Make plots of 2pt correlations
    aliases:
      twopoint_data_real: summary_statistics_real
  - name: TXPhotozPlotSource          # Plot the bin n(z)
    classname: TXPhotozPlot
    aliases:
        photoz_stack: shear_photoz_stack
        nz_plot: nz_source
  - name: TXRealGaussianCovariance
    threads_per_process: 32
  - name: TXDiagnosticQuantiles
  - name: TXPSFMaps
  - name: TXSourceDiagnosticPlots
    nprocess: 64
  - name: TXResponseInBins
    nprocess: 64
  - name: PZSOMInformer
    classname: SOMPZInformer
    module_name: rail.estimation.algos.sompz
    threads_per_process: 16
    aliases:
      model: deep_model
      input_data: sub_selected_shear_data
  - name: PZAssignSpectroGalaxiesToCells
    classname: SOMPZEstimatorDeep
    module_name: rail.estimation.algos.sompz
    aliases:
      assignment: assignment_som_deepspec_estimator
      data: input_spec_data
  - name: PZRedshiftsForCells
    classname: SOMPZPzc
    nprocess: 1
    module_name: rail.estimation.algos.sompz
    aliases:
      cell_deep_spec_data: assignment_som_deepspec_estimator
      spec_data: input_spec_data
      pz_c: pz_c_som_pzc_stage

  - name: PZGenerateSOMInformerSubsample
    nprocess: 64 
# Loop over the different variants we need to get tomographic
# bin assignments for
{% for variant in ["ns", "1p", "1m", "2p", "2m"] %}
  - name: PZAssignGalaxiesToCells_{{ variant }}
    classname: SOMPZEstimatorDeep
    nprocess: 64
    threads_per_process: 2
    module_name: rail.estimation.algos.sompz
    aliases:
      data: shear_catalog
      assignment: assignment_som_deepdeep_estimator_{{ variant }}

  - name: PZTomographyAndNZ_{{ variant }}
    classname: SOMPZ_tomobin_and_nz_onesom
    nprocess: 1
    module_name: rail.estimation.algos.sompz
    aliases:
      spec_data: input_spec_data
      cell_deep_spec_data: assignment_som_deepspec_estimator
      balrog_data: shear_catalog
      cell_deep_balrog_data: assignment_som_deepdeep_estimator_{{ variant }}
      pz_c: pz_c_som_pzc_stage
      tomo_bins_wide: tomo_bins_wide_{{ variant }}
      bhat_for_wide_data: bhat_for_wide_data_{{ variant }}
      nz: shear_photoz_stack_{{ variant }}
{% endfor %}

  - name: PZAddNonTomographicNZ
    aliases:
      input_photoz_stack: shear_photoz_stack_ns
      output_photoz_stack: shear_photoz_stack


