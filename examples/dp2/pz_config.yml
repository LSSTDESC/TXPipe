som_deepdeep_estimator:
  output_mode: default
  chunk_size: 10000
  hdf5_groupname: 'shear/ns'
  zbins_min: &id010 0.0 
  zbins_max: &id011 3.0
  zbins_dz: &id012 0.02
  calculated_point_estimates: &id001 []
  recompute_point_estimates: false
  redshift_col: &id017 z
  inputs: &id002
  - r_gaussFlux 
  - i_gaussFlux
  - z_gaussFlux
  input_errs: &id003
  - r_gaussFluxErr
  - i_gaussFluxErr
  - z_gaussFluxErr
  zero_points: &id004
  - 31.4
  - 31.4
  - 31.4
  som_shape: &id005
  - 32
  - 32
  som_minerror: 0.001
  som_wrap: &id013 false
  som_take_log: &id014 true
  convert_to_flux: &id015 false
  set_threshold: true
  thresh_val: 1.0e-05
  debug: &id016 false
  name: som_deepdeep_estimator

  # model: model_deep.pkl
  # data: /sdf/home/z/zhzhuoqi/rubin-user/DP2/DP2_test_WZ/mdet_catalog.hdf5
  
  thresh_val_err: 1.0e-05
  config: null
