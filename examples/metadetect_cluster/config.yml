global:
    chunk_rows: 100000

TXSourceTomography:
    bands: [r, i, z]
    source_zbin_edges: [0.5, 0.7, 0.9, 1.1, 2.0]

TXSourceSelectorMetadetect:
    input_pz: false
    true_z: true
    bands: [r, i, z]
    T_cut: 0.5
    s2n_cut: 10.0
    max_rows: 1000
    delta_gamma: 0.02
    source_zbin_edges: [0.5, 0.7, 0.9, 1.1, 2.0]

CLClusterBinningRedshiftRichness:
    zedge: [0.2, 0.4, 0.6, 0.8]
    richedge: [5., 10., 100.]

CLClusterShearCatalogs:
    max_radius: 5   # Mpc
    delta_z: 0.2   # redshift buffer
    redshift_cut_criterion: ztrue
    redshift_weight_criterion: ztrue
    subtract_mean_shear: false
    coordinate_system: celestial
    use_true_shear: false

CLClusterEnsembleProfiles:
    r_min: 0.5  # Mpc
    r_max: 5.  # Mpc
    nbins: 5
    delta_sigma_profile: true
    shear_profile: false
    magnification_profile: false
    # The example covers about 1 deg2, so all the clusters of a bin fall in
    # the same jackknife pixel: use the sample covariance instead
    cov_type: sample_covariance

CLClusterSACC:
    survey_name: example
    cov_component: tan_sc
